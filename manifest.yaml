# ─────────────────────────────────────────────────────────────────────────────
# Your app's manifest. This file IS the app's contract.
#
# Everything Pippa shows a user about your app is generated from this file, and
# the runtime refuses anything you did not declare here. If `outcomes` does not
# list it, your app cannot be asked to do it. If `output` does not name a
# field, returning that field is an error, not a bonus.
#
# That strictness is the point. A user installing your app sees a permission
# screen built from this file, so the file has to be the truth.
#
# Replace everything below with your own app. The example describes a small
# "days until" app so you can see the shape of each part.
# ─────────────────────────────────────────────────────────────────────────────

manifest_version: 1

# Your app keeps nothing between calls. This is not a preference you can
# change — every hackathon app runs with `persistence: none`, and the runtime
# throws away the machine your code ran on when it finishes.
persistence: none

# ── Your public author name ──────────────────────────────────────────────────
#
# EMPTY ON PURPOSE. Claude asks you for it before anything else, and nothing
# publishes until it is filled in (the build says "Nothing to publish yet").
#
# It is the name everybody sees next to your app: "by <name>" on the install
# screen, in the list of apps and on every answer your app gives. So it is
# PUBLIC, and it should be a pseudonym: a made-up name or a nickname, never
# your real name and never an email address. This repository is public too,
# so anyone can read it here as well.
#
# The rules: 3 to 30 characters; letters, numbers, spaces, dots, hyphens and
# underscores; starting with a letter or a number; nothing that looks like an
# email or a web address; and not "pippa", "official" or "verified". Another
# builder cannot use the same name, and you can use yours on all your apps.
#
# It does not decide who owns the app, and nothing in this file does. Pippa
# Labs created this repository for your Pippa account, so every app published
# from it is yours. docs/REVIEW_AND_SHARING.md is the whole story.
app_author_name: "Andy"

app:
  # Set from the repository name; it must stay like this.
  id: hack.app_4f34
  name: MealMind
  # Bump this before the next push once a version is submitted for review.
  version: 0.1.0
  # Never use the word "b-y" here: the badge is parsed on it.
  summary: >-
    Calories, protein and cost per serving for a recipe that fits your
    ingredients, time, budget and allergies. Nutrition from public USDA data;
    costs only from prices you give. Filters declared allergens;
    cross-contact cannot be assessed.

agent_types:
  - personal

outcomes:
  - id: meal.match
    summary: >-
      Work out calories, protein and cost per serving of a recipe that fits
      the ingredients, cooking time, budget, diet and allergens in the message
    example_phrases:
      - how many calories and protein per serving
      - high protein recipe with at least 30g protein
      - cost per serving of a meal for two
      - filter recipes excluding nuts
      - meal under 600 calories with what i have
      - cheapest dinner i can make with these prices
      - what can i cook in under 20 minutes
      - dinner for two under five pounds
    inputs:
      - name: ingredients
        type: array
        item_type: string
        required: false
        description: >-
          The food the person says they already have, one ingredient per item,
          keeping any amount they gave with it ("3 eggs", "200 g rice",
          "two tomatoes"). Copy their words; do not add ingredients they did not
          name. Leave this out if they named none.
      - name: max_minutes
        type: integer
        required: false
        description: >-
          The most minutes they have to cook, if they said ("20 minutes",
          "half an hour" is 30). Leave this out if they gave no time. Never
          guess a typical time.
      - name: servings
        type: integer
        required: false
        description: >-
          How many people or portions they are cooking for, if they said ("for
          two" is 2). Leave this out if they did not say. Never guess.
      - name: budget
        type: number
        required: false
        description: >-
          The amount of money they want to spend, as a plain number without
          the currency symbol ("under £5" is 5). Leave this out if they named
          no budget. Never guess one.
      - name: budget_per_person
        type: boolean
        required: false
        description: >-
          True only if they said the budget is per person or per portion ("£2
          each"). Leave this out if they did not say so.
      - name: currency
        type: string
        required: false
        description: >-
          The currency of their budget or prices, as a code such as GBP, USD,
          EUR or CNY, if they gave one or used its symbol. Return an empty
          string rather than guessing.
      - name: prices
        type: array
        item_type: string
        required: false
        description: >-
          Prices they gave for ingredients, one per item, each with the pack
          size they stated, copied in their words ("eggs £1.80 for 6", "rice
          1.20 per kg", "tomatoes 30p each"). Leave this out if they gave no
          prices. Never invent or look up a price.
      - name: diet
        type: array
        item_type: string
        required: false
        description: >-
          Any diet they follow, if they said: vegetarian, vegan, pescatarian,
          no pork, no beef, gluten free, dairy free. Leave this out if they
          named none. Never guess a diet.
      - name: allergens
        type: array
        item_type: string
        required: false
        description: >-
          Every allergy or intolerance they mentioned, one per item ("peanuts",
          "milk", "gluten", "sesame"). Include all of them. Leave this out if
          they mentioned none. Never guess.
      - name: exclude
        type: array
        item_type: string
        required: false
        description: >-
          Foods they said they do not want or dislike, one per item
          ("mushrooms", "no chilli"). Leave this out if they named none.
      - name: min_protein_g
        type: number
        required: false
        description: >-
          The least protein they want per serving, in grams, if they named a
          number ("at least 30 g protein" is 30). Leave this out if they gave
          no number. Never guess a target.
      - name: max_calories
        type: number
        required: false
        description: >-
          The most calories (kcal) they want per serving, if they named a
          number ("under 600 calories" is 600). Leave this out if they gave no
          number. Never guess a limit.
      - name: recent_meals
        type: array
        item_type: string
        required: false
        description: >-
          Meals they say they ate recently, in this message only, one per item
          ("egg fried rice", "pasta last night" is "pasta"). Leave this out if
          they mentioned none.
    output:
      - name: status
        type: string
        description: '"matched" when a recipe fits, "no_match" when nothing does.'
      - name: reasons
        type: array
        item_type: string
        description: Why the top pick ranked first, one scoring rule per line, with its points.
      - name: alternatives
        type: array
        item_type: string
        description: Up to two runners-up, each one line with time, what to buy and nutrition.
      - name: excluded
        type: array
        item_type: string
        description: Recipes ruled out, each with the hard rule it broke.
      - name: limitations
        type: array
        item_type: string
        description: What the answer assumes or cannot know. Always pass these on.
      - name: data_sources
        type: array
        item_type: string
        description: Where the recipes, nutrition and prices came from.
      - name: budget_status
        type: string
        description: within_budget, over_budget, cannot_verify or no_budget_given.
      - name: top_pick
        type: string
        required: false
        description: The recommended recipe's name.
      - name: top_pick_source
        type: string
        required: false
        description: Which source the recipe comes from.
      - name: top_pick_link
        type: string
        required: false
        description: The recipe's page, for TheMealDB recipes only.
      - name: top_pick_servings
        type: integer
        required: false
        description: The number of servings the amounts are for.
      - name: top_pick_minutes
        type: integer
        required: false
        description: The recipe card's own estimate of the total time.
      - name: time_basis
        type: string
        required: false
        description: Where the time comes from, or that it is unknown.
      - name: top_pick_ingredients
        type: array
        item_type: string
        required: false
        description: Every ingredient with its amount for the servings given.
      - name: top_pick_steps
        type: array
        item_type: string
        required: false
        description: The method, one step per line.
      - name: kcal_per_serving
        type: number
        required: false
        description: Estimated kcal for one serving.
      - name: protein_g_per_serving
        type: number
        required: false
        description: Estimated grams of protein for one serving.
      - name: nutrition_basis
        type: string
        required: false
        description: How the nutrition was worked out, or that it is unknown.
      - name: you_have
        type: array
        item_type: string
        required: false
        description: Ingredients of the pick the person already has.
      - name: to_buy
        type: array
        item_type: string
        required: false
        description: What they must buy, with amounts.
      - name: assumed_staples
        type: array
        item_type: string
        required: false
        description: Cupboard staples assumed to be at home and left out of the costs.
      - name: currency
        type: string
        required: false
        description: The currency of every amount of money.
      - name: budget_total
        type: number
        required: false
        description: The budget for the whole meal, after any per-person budget is multiplied out.
      - name: spend_now
        type: number
        required: false
        description: Whole packs that must be bought now. Absent when a needed price is missing.
      - name: used_ingredients_cost
        type: number
        required: false
        description: The share of each pack this meal uses. Absent when a price is missing.
      - name: cost_per_serving
        type: number
        required: false
        description: used_ingredients_cost divided by the servings.
      - name: whole_pack_cost
        type: number
        required: false
        description: Every whole pack the recipe needs if bought from scratch.
      - name: cost_basis
        type: string
        required: false
        description: What each cost means.
      - name: conflicts
        type: array
        item_type: string
        required: false
        description: Requests that could not all be met at once, and which rule caused it.
      - name: unrecognised_inputs
        type: array
        item_type: string
        required: false
        description: Parts of the request MealMind could not read or apply.

# The app's own key for the optional TheMealDB lookup. Its value is set only
# in Pippa (Apps > Created by me > MealMind > Keys), never in any file. The
# app works fully without it.
app_secrets:
  - name: THEMEALDB_API_KEY
    description: "Optional TheMealDB API key, used only to fetch extra recipes from themealdb.com."
    required: false
